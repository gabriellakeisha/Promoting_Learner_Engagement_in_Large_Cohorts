<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lecture Engagement Platform</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🎓 Create Account</h1>
        <p>Join the Lecture Engagement Platform</p>
      </div>

      <div id="alert-container"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="displayName">Full Name</label>
          <input 
            type="text" 
            id="displayName" 
            class="form-input" 
            placeholder="John Doe"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="student@qub.ac.uk"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Minimum 6 characters"
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-input" 
            placeholder="Re-enter your password"
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label for="role">I am a...</label>
          <select id="role" class="form-select" required>
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
          </select>
        </div>

        <div class="form-group" id="lecturer-code-group" style="display:none;">
          <label for="lecturerCode">Lecturer Access Code</label>
          <input 
            type="text" 
            id="lecturerCode" 
            class="form-input" 
            placeholder="Enter the code provided by your department"
          >
          <p style="font-size:12px;color:var(--text-secondary);margin-top:6px;">
            A valid access code is required to register as a lecturer. Contact your department administrator if you do not have one.
          </p>
        </div>

        <button type="submit" class="btn btn-primary" id="register-btn">
          Create Account
        </button>
      </form>

      <p class="text-center mt-3" style="color: var(--text-secondary); font-size: 14px;">
        Already have an account? 
        <a href="/" style="color: var(--primary-color); font-weight: 600;">Login here</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('role').addEventListener('change', function() {
      var codeGroup = document.getElementById('lecturer-code-group');
      if (this.value === 'lecturer') {
        codeGroup.style.display = 'block';
      } else {
        codeGroup.style.display = 'none';
        document.getElementById('lecturerCode').value = '';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      
      const data = {
        displayName: document.getElementById('displayName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
      };

      var confirmPassword = document.getElementById('confirmPassword').value;
      if (data.password !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter.', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      if (data.role === 'lecturer') {
        data.lecturerCode = document.getElementById('lecturerCode').value;
      }
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
          showAlert(result.message || 'Registration failed', 'error');
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
    
    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      container.innerHTML = `
        <div class="alert alert-${type}" style="padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;
          ${type === 'success' ? 'background:#dcfce7;color:#166534;border:1px solid #bbf7d0;' : ''}
          ${type === 'error' ? 'background:#fef2f2;color:#991b1b;border:1px solid #fecaca;' : ''}
        ">
          ${message}
        </div>
      `;
      setTimeout(() => { container.innerHTML = ''; }, 5000);
    }
  </script>
  <script src="/js/dark-mode.js"></script>
</body>
</html>
