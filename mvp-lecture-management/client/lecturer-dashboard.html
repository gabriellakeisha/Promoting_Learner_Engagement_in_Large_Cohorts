<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturer Dashboard - Lecture Engagement</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/analytics.css">
  <link rel="stylesheet" href="/css/reflection.css">
  <link rel="stylesheet" href="/css/polls.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .analytics-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      z-index: 1000;
      padding: 20px;
      display: none;
    }

    .analytics-overlay.show {
      display: block;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="navbar-content">
      <div class="navbar-brand"> 🔊 Echo Class - Lecturer</div>
      <div class="navbar-user">
        <div class="navbar-avatar" id="navbar-avatar" onclick="openProfileModal()" title="Edit Profile">
        </div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-role">lecturer</div>
        </div>
        <button class="btn btn-secondary btn-small" id="logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard">
      <div class="dashboard-header">
        <h2>My Sessions</h2>
        <button class="btn btn-primary" id="create-session-btn">+ Create New Session</button>
      </div>

      <div id="alert-container"></div>

      <div id="create-modal" class="modal-overlay">
        <div style="background: var(--card-bg, white); border-radius: 16px; padding: 32px; max-width: 500px; width: 90%; color: var(--text-color, #1a1a2e);">
          <h3 style="margin-bottom: 24px; color: var(--text-color, #1a1a2e);">Create New Session</h3>
          <form id="create-session-form">
            <div class="form-group">
              <label for="title">Session Title</label>
              <input type="text" id="title" class="form-input" required>
            </div>
            <div class="form-group">
              <label for="moduleCode">Module Code</label>
              <input type="text" id="moduleCode" class="form-input" placeholder="e.g., CSC3002">
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" class="form-input" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="schedule-toggle" style="width:18px;height:18px;accent-color:#667eea;">
                <span>Schedule for later</span>
              </label>
            </div>
            <div id="schedule-fields" style="display:none;">
              <div class="form-group">
                <label for="scheduledStart">Start Date & Time</label>
                <input type="datetime-local" id="scheduledStart" class="form-input">
              </div>
              <div class="form-group">
                <label for="scheduledEnd">End Date & Time (optional)</label>
                <input type="datetime-local" id="scheduledEnd" class="form-input">
              </div>
            </div>
            <div style="display: flex; gap: 12px;">
              <button type="submit" class="btn btn-primary" style="flex: 1;" id="create-submit-btn">Create</button>
              <button type="button" class="btn btn-secondary" style="flex: 1;" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div id="loading">
        <div class="spinner"></div>
      </div>

      <div id="sessions-container" class="hidden">
        <div id="sessions-list" class="sessions-grid"></div>
        <div id="no-sessions" class="hidden text-center" style="padding: 40px; color: var(--text-secondary);">
          <p>No sessions yet. Create your first session to get started!</p>
        </div>
      </div>

      <!-- Semester Analytics (Macro) -->
      <div id="macro-dashboard-section" style="margin-top: 32px;">
        <h2 style="margin-bottom: 16px;">Semester Analytics</h2>
        <div id="macro-dashboard-content"
          style="background: var(--card-bg, #1e293b); border-radius: 16px; padding: 24px;">
          <div class="spinner" style="margin: 20px auto;"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Analytics Modal (per-session micro) -->
  <div id="analytics-modal" class="analytics-overlay">
    <div class="analytics-modal-content">
      <button type="button" id="close-analytics-x" class="analytics-close-x" aria-label="Close">&times;</button>
      <div class="analytics-header">
        <h2 id="analytics-title">Session Analytics</h2>
        <div class="analytics-header-buttons">
          <button class="btn btn-secondary btn-small export-csv-btn" onclick="exportToCSV()">Export CSV</button>
          <button class="btn btn-primary btn-small" onclick="generateAISummary()" id="ai-summary-btn">Session Summary</button>
        </div>
      </div>
      <div id="analytics-content">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="/js/lecturer-dashboard.js"></script>
  <script src="/js/macro-analytics.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/dark-mode.js"></script>
  <script src="/js/manage-students.js"></script>
</body>

</html>
