<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Lecture Engagement</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/analytics.css">
  <link rel="stylesheet" href="/css/reflection.css">
  <link rel="stylesheet" href="/css/polls.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-content">
      <div class="navbar-brand"> 🔊 Echo Class - Student</div>
      <div class="navbar-user">
        <!-- Avatar (clickable) -->
        <div class="navbar-avatar" id="navbar-avatar" onclick="openProfileModal()" title="Edit Profile">
        </div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-role" id="user-role">student</div>
        </div>
        <button class="btn btn-secondary btn-small" id="logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard">
      <div class="dashboard-header">
        <h2>My Sessions</h2>
        <p style="color: var(--text-secondary)">View your enrolled lecture sessions</p>
      </div>

      <div id="alert-container"></div>

      <!-- Sessions List -->
      <div id="loading" class="text-center">
        <div class="spinner"></div>
      </div>

      <div id="sessions-container" class="hidden">
        <h3 style="margin-bottom: 16px; font-size: 18px;">Your Enrolled Sessions</h3>
        <div id="sessions-list" class="sessions-grid"></div>
        <div id="no-sessions" class="hidden text-center" style="padding: 40px; color: var(--text-secondary);">
          <p>You haven't been enrolled in any sessions yet.</p>
          <p style="font-size: 14px; margin-top: 8px;">Contact your lecturer to be added to a session.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        const result = await response.json();

        if (!result.success) {
          window.location.href = '/';
          return;
        }

        currentUser = result.user;
        document.getElementById('user-name').textContent = currentUser.displayName;
        document.getElementById('user-role').textContent = currentUser.role;

        if (currentUser.role === 'lecturer') {
          window.location.href = '/lecturer-dashboard';
          return;
        }

        loadSessions();
      } catch (error) {
        window.location.href = '/';
      }
    }

    // Load sessions
    async function loadSessions() {
      try {
        const response = await fetch('/api/sessions/my-sessions');
        const result = await response.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('sessions-container').classList.remove('hidden');

        if (result.success && result.sessions.length > 0) {
          displaySessions(result.sessions);
        } else {
          document.getElementById('no-sessions').classList.remove('hidden');
        }
      } catch (error) {
        showAlert('Error loading sessions', 'error');
      }
    }

    // Display sessions
    function displaySessions(sessions) {
      const container = document.getElementById('sessions-list');
      container.innerHTML = sessions.map(session => `
        <div class="session-card" onclick="openSession('${session._id || session.id}')">
          <div class="session-title">${session.title}</div>
          <div class="session-meta">
            <div class="session-meta-item">
              📚 ${session.moduleCode || 'No module code'}
            </div>
            <div class="session-meta-item">
              👨‍🏫 ${session.lecturer || 'Unknown'}
            </div>
            <div class="session-meta-item">
              <span class="session-status status-${session.status}">
                ${session.status}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Open session
    function openSession(sessionId) {
      console.log('Opening session:', sessionId);
      window.location.href = `/chat-room.html?sessionId=${sessionId}`;
    }

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => container.innerHTML = '', 5000);
    }

    // Initialize
    checkAuth();
  </script>
  <script src="/js/profile.js"></script>
  <script src="/js/dark-mode.js"></script>
</body>

</html>
