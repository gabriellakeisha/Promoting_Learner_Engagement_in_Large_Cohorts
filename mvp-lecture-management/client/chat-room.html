<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room - Lecture Engagement</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/compact.css">
<link rel="stylesheet" href="/css/announcement-pin.css">
<script src="/socket.io/socket.io.js"></script>
<!-- Emoji Picker Library -->
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
<style>
  /* Dark theme for emoji picker */
  emoji-picker {
    --background: #1f2c34;
    --border-color: #334155;
    --indicator-color: #00a884;
    --input-border-color: #475569;
    --input-font-color: #e2e8f0;
    --input-placeholder-color: #94a3b8;
    --outline-color: #00a884;
    --category-font-color: #94a3b8;
    --button-active-background: #334155;
    --button-hover-background: #475569;
    width: 100%;
    max-width: 350px;
    height: 400px;
    border-radius: 12px;
  }
  
  /* Header content wrapper */
  .chat-header .header-content {
    flex: 1;
    min-width: 0;
  }
  
  .chat-header .header-content h2 {
    margin: 0 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .chat-header .header-content p {
    margin: 0;
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>
<nav class="navbar">
<div class="navbar-content">
<div class="navbar-brand">
<a href="/student-dashboard.html" id="back-link" style="text-decoration: none; color: inherit;">
          ← Back to Dashboard
</a>
</div>
<div class="navbar-user">
<div class="user-info">
<div class="user-name" id="user-name">Loading...</div>
</div>
</div>
</div>
</nav>

<div class="container">
<div class="chat-container">
<!-- Chat Header -->
<div class="chat-header">
<h2 id="session-title">Loading...</h2>
<p id="session-info">Session information</p>
</div>

<!-- Messages -->
<div class="chat-messages" id="messages-container">
<div id="loading" class="text-center">
<div class="spinner"></div>
</div>
</div>

<!-- Input -->
<div class="chat-input-container">
<div class="form-group" style="margin-bottom: 12px;">
<label for="message-type">Message Type:</label>
<select id="message-type" class="form-select">
<option value="QUESTION">❓ Question</option>
<option value="COMMENT">💬 Comment</option>
<option value="CONFUSION">❗ Confusion</option>
</select>
</div>

<div class="chat-input-wrapper">
<textarea 
id="message-input" 
class="chat-input" 
placeholder="Type your message here..."
rows="3"
></textarea>
<button id="send-btn" class="send-btn-corner">➤</button>
</div>
</div>
</div>
</div>

<script src="/js/profile.js"></script>
<script src="/js/identity-mode.js"></script>
<script src="/js/announcement-pin.js"></script>
<script src="/js/student-chat.js"></script>
<script src="/js/dark-mode.js"></script>
<script src="/js/student-reflection.js"></script>
</body>
</html>
